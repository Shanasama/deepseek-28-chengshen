  <circle cx="594" cy="154" r="7" fill="#253b42"/>
  <circle cx="596" cy="151" r="2.5" fill="#fff"/>
  <path d="M573 129q14-10 30-2" fill="none" stroke="#253b42" stroke-width="5" stroke-linecap="round"/>

