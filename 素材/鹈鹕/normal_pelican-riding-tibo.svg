  <path d="M520 300c-42-9-76-32-122-18l23 18-21 12c44-9 69 18 110 8Z" fill="#d65c46" stroke="#253b42" stroke-width="5" stroke-linejoin="round"/>
  <path d="M422 292q51-4 85 20" fill="none" stroke="#f39573" stroke-width="4" stroke-linecap="round"/>

  <g fill="#aa9677" opacity=".6">
    <ellipse cx="163" cy="704" rx="9" ry="3"/>
    <ellipse cx="845" cy="711" rx="13" ry="3"/>
    <ellipse cx="778" cy="733" rx="6" ry="2"/>
  </g>
