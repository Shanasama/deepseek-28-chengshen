<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕骑 Tibo 自行车</title>
  <desc id="desc">一只戴着红色小帽子的白色鹈鹕，骑着蓝色 Tibo 自行车，长长的橙色鸟喙迎着风。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#fff9ec"/>
      <stop offset="1" stop-color="#f2e8d7"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#ffd168"/>
      <stop offset="1" stop-color="#f39a45"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffefa"/>
      <stop offset="1" stop-color="#deddd3"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="800" rx="40" fill="url(#sky)"/>
  <circle cx="760" cy="236" r="117" fill="#efd1a4" opacity=".42"/>
