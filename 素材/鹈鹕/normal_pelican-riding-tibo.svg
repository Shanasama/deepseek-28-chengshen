    <circle cx="719" cy="577" r="112" stroke-width="15"/>
  </g>
  <g fill="none" stroke="#a2afab" stroke-width="3">
    <circle cx="290" cy="577" r="96"/>
    <circle cx="719" cy="577" r="96"/>
    <path d="M290 481v192m-96-96h192m-164-68 136 136m0-136-136 136m31-156 74 178m-126-126 178 74m-126 52 74-178m-126 126 178-74"/>
    <path d="M719 481v192m-96-96h192m-164-68 136 136m0-136-136 136m31-156 74 178m-126-126 178 74m-126 52 74-178m-126 126 178-74"/>
  </g>
  <path d="M187 534a112 112 0 0 1 195-21M618 532a112 112 0 0 1 193-17" fill="none" stroke="#738d8f" stroke-width="9" stroke-linecap="round"/>

