  <path d="m474 550-40 16 33 7 36-9" fill="#e4a44c" stroke="#253b42" stroke-width="5" stroke-linejoin="round"/>
  <path d="m441 579 43-4" stroke="#253b42" stroke-width="10" stroke-linecap="round"/>

