  <path d="M536 125q8-45 44-39 29 5 33 35" fill="#d65c46" stroke="#253b42" stroke-width="5"/>
  <path d="M530 125q48-13 99 2l-37 9Z" fill="#b74637" stroke="#253b42" stroke-width="5" stroke-linejoin="round"/>
  <path d="M569 89q-14 9-15 27" fill="none" stroke="#f59b70" stroke-width="5" stroke-linecap="round"/>
