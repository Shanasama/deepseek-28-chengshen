    <path d="M402 347q102 73 193 37"/>
    <path d="M402 366q95 60 166 33"/>
    <path d="M385 356q28 23 53 30"/>
  </g>
  <path d="m653 349 22-9" stroke="#253b42" stroke-width="7" stroke-linecap="round"/>

